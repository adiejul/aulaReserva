name: 08 - Desplegar AulaReserva en EC2 

on:
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: production

    steps:

      # 1. Descargar el repositorio
      - name: Descargar codigo
        uses: actions/checkout@v7

      # 2. Configurar produccion
      - name: Configurar entorno
        env:
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          test "$APP_ENV" = "development"
          sed -i "s/development/$APP_ENV/g" frontend/config.js
          cat frontend/config.js

      # 3. Construir y guardar la imagen
      - name: Construir imagen Docker
        run: |
          docker build -t aulareserva:latest .
          docker save aulareserva:latest | gzip > aulareserva.tar.gz

      # 4. Preparar la conexion SSH
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 5. Enviar la imagen a EC2
      - name: Enviar imagen a EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            aulareserva.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/"

      # 6. Ejecutar el contenedor en EC2
      - name: Desplegar AulaReserva
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo docker load -i /tmp/aulareserva.tar.gz"

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo docker volume create aulareserva_datos"

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo docker rm -f aulareserva || true"

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo docker run -d \
            --name aulareserva \
            -p ${EC2_PORT:-8080}:80 \
            -v aulareserva_datos:/var/www/data \
            --restart unless-stopped \
            aulareserva:latest"
