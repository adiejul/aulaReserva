name: Validar proyecto

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revisar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Comprobar archivos frontend
        uses: ./.github/actions/validar-aulaReserva
        with:
          rutas: |
            frontend/index.html
            frontend/app.js
            frontend/styles.css
            frontend/config.js

      - name: Comprobar sintaxis JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/config.js

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar archivos backend
        uses: ./.github/actions/validar-aulaReserva
        with:
          rutas: |
            backend/public/index.php
            backend/public/router.php
            backend/src/bootstrap.php
            database/schema.sql

      - name: Comprobar sintaxis PHP
        run: |
          php -l backend/public/index.php
          php -l backend/public/router.php
          php -l backend/src/bootstrap.php

  resultado:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Frontend y backend correctos"