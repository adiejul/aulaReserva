<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aulaReserva - Reserva un aula</title>
    <style>
        #listadoAulas {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .recuadros {
            border: 1px solid black;
            border-radius: 8px;
            padding: 1rem;
            width: 220px;
        }
    </style>
</head>

<body>

    <h1>AulaReserva</h1>
    <section>

        <h2>Aulas disponibles</h2>
        <div id="listadoAulas"></div>
    </section>

    <hr>

    <form id="formReserva">

        <label for="aula">Aula</label>
        <select name="aula" id="aula">
            <option value="">Selecciona un aula</option>
        </select>
        
        <div>
            <label for="fecha">Fecha</label>
            <input type="date" name="fecha" id="fecha">
        </div>
        <div>
            <label for="hora">Hora</label>
            <input type="time" name="hora" id="hora">
        </div>
        <div>
            <label for="responsable">Responsable de la reserva</label>
            <input type="text" name="responsable" id="responsable">
        </div>
        <div>
            <button type="submit">Reservar</button>
        </div>
        <p id="mensajeFormulario"></p>

    </form>

    <script src="app.js"></script>

</body>

</html>
